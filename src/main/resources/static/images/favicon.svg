<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a0845" />
            <stop offset="100%" stop-color="#0e0417" />
        </linearGradient>
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d946ef" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Squircle container -->
    <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
    
    <!-- Central soft radial glow -->
    <circle cx="50" cy="50" r="36" fill="url(#innerGlow)" />

    <!-- Letter K -->
    <text x="44" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#ffffff" text-anchor="middle">K</text>
    
    <!-- Sparkle Star ✦ -->
    <path d="M 72 26 Q 74 34 82 36 Q 74 38 72 46 Q 70 38 62 36 Q 70 34 72 26 Z" fill="#d946ef" filter="url(#glow)" />
</svg>
